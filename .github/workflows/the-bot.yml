name: The Bot

# Reruns the prediction model and publishes bot/*.json to the site.
# Times are UTC. The public data mirror refreshes Sun + Mon ~06:30 UTC.
on:
  schedule:
    - cron: "10 14 * 8-12,1 0"   # Sun  8:10am MT  first look after Saturday
    - cron: "10 13 * 8-12,1 1"   # Mon  7:10am MT  full week of results -> next week's picks
    - cron: "10 13 * 8-12,1 3"   # Wed  7:10am MT  refresh + lock Thursday games
    - cron: "10 15 * 8-12,1 5"   # Fri  9:10am MT  refresh + lock Friday/Saturday games
    - cron: "0 11 4 10 *"        # one-off: Sun Oct 4 5:00am MT, Elevation Index goes automatic
    # game nights: hourly so finals (from NCAA.com) show up the same night
    - cron: "40 18-23 * 8-12,1 6"  # Sat 12:40pm-5:40pm MT
    - cron: "40 0-9 * 8-12,1 0"    # Sat 6:40pm - Sun 3:40am MT (covers Hawai'i kickoffs)
    - cron: "40 2-7 * 8-12,1 5,6"  # Thu + Fri nights 8:40pm-1:40am MT
  workflow_dispatch:
    inputs:
      preview:
        description: "Also write an Index preview to bot/"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: the-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - run: pip install -r model/requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: model/cache
          key: bot-data-${{ github.run_id }}
          restore-keys: bot-data-

      - name: Run model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}  # optional: live Vegas lines for grading
          INDEX_PREVIEW: ${{ inputs.preview }}
        run: python model/run.py

      - name: Publish
        run: |
          git config user.name "The Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/ ei-auto.js ei-national.js
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "The Bot: update $(date -u +%Y-%m-%d)"
          # if another run published first, keep this run's (newer) data files
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
