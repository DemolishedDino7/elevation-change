name: The Bot (hoops)

# Reruns the men's basketball model and publishes hoops/*.json to the site.
# Times are UTC; Mountain Standard Time is UTC-7 all basketball season.
on:
  schedule:
    - cron: "10 13 * 10-12,1-4 *"          # daily 6:10am MT: full refresh (data mirror updates overnight)
    - cron: "40 23 * 11,12,1-4 *"          # 4:40pm MT: lock evening picks, afternoon finals
    - cron: "40 3,5,7,9 * 11,12,1-4 *"     # 8:40pm, 10:40pm, 12:40am, 2:40am MT: same-night finals (Hawai'i too)
    - cron: "25 14,16,19 * 10-12,1-4 *"    # 7:25am, 9:25am, 12:25pm MT: backups; if GitHub skipped the 6:10am run, these do the full refresh (and Monday bracket) instead
  workflow_dispatch:
    inputs:
      full:
        description: "Full refit (otherwise a quick refresh outside the morning run)"
        required: false
        default: "yes"
      bracket:
        description: "Also rebuild the March Madness bracket now (otherwise Mondays)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: hoops-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - run: pip install -r model/requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: model/hoops/cache
          key: hoops-data-${{ github.run_id }}
          restore-keys: hoops-data-

      - name: Exhibitions
        continue-on-error: true
        run: |
          # every full refresh, including a backup run catching up on a skipped morning
          today=$(TZ=America/Denver date +%F)
          last=$(python -c "import json;print(json.load(open('hoops/meta.json')).get('last_full') or '')" 2>/dev/null || true)
          if [ "${{ github.event.schedule }}" = "10 13 * 10-12,1-4 *" ] || [ "${{ inputs.full }}" = "yes" ] || [ "$last" != "$today" ]; then
            python model/hoops/fetch_exhibitions.py
          fi

      - name: Run model
        run: |
          extra=""
          if [ "${{ inputs.bracket }}" = "yes" ]; then extra="--bracket"; fi
          if [ "${{ github.event.schedule }}" = "10 13 * 10-12,1-4 *" ] || [ "${{ inputs.full }}" = "yes" ]; then
            python model/hoops/run.py $extra
          else
            python model/hoops/run.py --quick $extra
          fi

      - name: Publish
        run: |
          git config user.name "The Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoops/ model/hoops/exhibitions.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "The Bot (hoops): update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
