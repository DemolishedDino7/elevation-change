name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          SB='https://sdataprod.ncaa.com/?meta=GetContests_web&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%227287cda610a9326931931080cb3a604828febe6fe3c9016a7e4a36db99efdb7c%22%7D%7D&variables='
          for d in 11 12; do for w in 4 5; do
            curl -sL -m 30 -A "Mozilla/5.0" "${SB}$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps({'sportCode':'MFB','division':$d,'seasonYear':2026,'contestDate':None,'week':$w},separators=(',',':'))))")" > out/sb_${d}_${w}.json
          done; done
          TS='https://sdataprod.ncaa.com/?meta=GetGamecenterTeamStatsFootball_web&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%22b41348ee662d9236483167395b16bb6ab36b12e2908ef6cd767685ea8a2f59bd%22%7D%7D&variables='
          curl -sL -m 30 -A "Mozilla/5.0" "${TS}$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps({'contestId':'6604167','staticTestEnv':None},separators=(',',':'))))")" > out/ts.json
          ls -la out
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-out; git add -f out; git commit -m probe; git push -f origin probe-out
