name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          for u in \
            "https://data.ncaa.com/casablanca/game/6604167/boxscore.json" \
            "https://data.ncaa.com/casablanca/game/6604167/teamStats.json" \
            "https://data.ncaa.com/casablanca/game/6604167/gameInfo.json" \
            "https://ncaa-api.henrygd.me/game/6604167/boxscore" \
            "https://ncaa-api.henrygd.me/game/6604167/team-stats" \
            "https://ncaa-api.henrygd.me/game/6604167" \
            "https://sdataprod.ncaa.com/?meta=GetGamecenterTeamStatsFootball_web&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%22b41348ee662d9236483167395b16bb6ab36b12e2908ef6cd767685ea8a2f59bd%22%7D%7D&variables=%7B%22contestId%22%3A%226604167%22%2C%22staticTestEnv%22%3Anull%7D" \
            "https://www.ncaa.com/game/6604167/boxscore" \
            ; do echo "=== $u"; curl -sL -m 30 -A "Mozilla/5.0" -w "\nHTTP %{http_code} %{size_download}\n" "$u" | head -c 2500; echo; done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-out; git add -f probe.txt; git commit -m probe; git push -f origin probe-out
