name: Fetch Torvik player data

# One-off / occasional: pulls Bart Torvik's player tables (recruit ranks, class,
# production) into model/hoops/torvik/ for the basketball Bot's preseason prior.
on:
  workflow_dispatch:
    inputs:
      first:
        description: "First season (2026 = 2025-26)"
        required: false
        default: "2012"
      last:
        description: "Last season"
        required: false
        default: "2026"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          mkdir -p model/hoops/torvik
          python model/hoops/probe_sources.py 2>&1 | tee model/hoops/torvik/fetch_log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/hoops/torvik
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Torvik player data for the hoops prior"
          git pull --rebase origin main
          git push origin HEAD:main
