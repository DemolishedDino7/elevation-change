name: Fetch bracket logos (side branch only)
on:
  push:
    branches: [bracket-logos]
    paths: [".github/workflows/fetch-logos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: bracket-logos }
      - run: |
          mkdir -p espn-logos
          for id in 2 8 12 26 28 30 41 43 44 46 47 57 61 66 84 93 96 97 98 120 127 130 139 145 147 150 152 153 156 158 194 231 235 238 239 245 248 251 252 258 261 269 275 295 333 350 356 2006 2110 2132 2272 2294 2296 2305 2377 2390 2507 2509 2511 2514 2541 2546 2571 2598 2599 2628 2633 2641 2670 2750 2752; do
            curl -sfL "https://a.espncdn.com/i/teamlogos/ncaa/500/$id.png" -o espn-logos/$id.png || echo "miss $id"
          done
          git config user.name "logo-bot"; git config user.email "logo-bot@users.noreply.github.com"
          git add espn-logos && git commit -m "ESPN logos for bracket cards" && git push origin bracket-logos
