name: exh probe (temporary)
on:
  workflow_dispatch:
    inputs:
      ref:
        default: exh-probe
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r model/requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: model/hoops/cache
          key: hoops-data-${{ github.run_id }}
          restore-keys: hoops-data-
      - run: python probe/p.py
      - run: |
          git config user.name "probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe && git commit -m "probe output" && git push origin HEAD:${{ inputs.ref }}
