.tabs {
  display: flex;

  border-bottom: 1px solid var(--line);
  scrollbar-width: none;

}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  position: relative;
  background: none;
  border: 0;
  padding: 0 0 0.5rem;
  margin: 0;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--display);
  font-style: italic;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 1.125rem;
  font-weight: 600;
  white-space: nowrap;
  transition: color 0.18s ease;
}
.tab::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -0.9rem;
  height: 3px;
  background: var(--purple);
  border-radius: 2px;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.22s ease;
}
.tab:hover { color: var(--paper); }
.tab[aria-selected="true"] { color: var(--paper); }
.tab[aria-selected="true"]::after { transform: scaleX(1); }
.apr, .rv {
  margin-left: 0.5rem;
  font-family: var(--mono);
  font-size: 0.625rem;
  letter-spacing: 0.06em;
  vertical-align: 0.15em;
}
.apr { color: var(--paper); background: var(--purple-deep); padding: 0.15rem 0.35rem; border-radius: 3px; }
.rv { color: var(--muted); }

   Rows sort by conference record first, then overall, like ESPN.
   Use "@ Team" for away games and "vs Team" for home games.

/* ---- nothing below here needs editing ---- */

const tabsEl = document.getElementById('tabs');
const panelEl = document.getElementById('panel');
const names = Object.keys(DATA);

function sortTeams(list) {
  const rec = r => r.split('-').map(Number);
  const score = r => !r ? 0 : (r.indexOf('RV') === 0 ? +r.slice(3) : 10000 - +r);
  return list.slice().sort((a, b) => {
    const [cwa, cla] = rec(a[2]), [cwb, clb] = rec(b[2]);
    if (cwb !== cwa) return cwb - cwa;          // conference wins
    if (cla !== clb) return cla - clb;          // conference losses
    const [owa, ola] = rec(a[1]), [owb, olb] = rec(b[1]);
    if (owb !== owa) return owb - owa;          // overall wins
    if (ola !== olb) return ola - olb;          // overall losses
    const sa = score(a[4]), sb = score(b[4]);
    if (sb !== sa) return sb - sa;              // ranking / votes
    return a[0].localeCompare(b[0]);
  });
}

function render(conf) {
  const rows = sortTeams(DATA[conf]).map(t => {
    const r = t[4];
    const badge = !r ? '' :
      (r.indexOf('RV') === 0
        ? '<span class="rv">' + r + '</span>'
        : '<span class="apr">' + r + '</span>');
    return '<tr><td class="team">' + t[0] + badge + '</td>' +
      '<td class="num">' + t[1] + '</td>' +
      '<td class="num">' + t[2] + '</td>' +
      '<td class="next">' + t[3] + '</td></tr>';
  }).join('');

  panelEl.innerHTML =
    '<div class="table-scroll"><table class="standings">' +
    '<thead><tr><th scope="col">Team</th><th scope="col">Record</th>' +
    '<th scope="col">Conf.</th><th scope="col">Next game</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';

  [...tabsEl.children].forEach(b =>
    b.setAttribute('aria-selected', b.textContent === conf ? 'true' : 'false'));
}

names.forEach(n => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.textContent = n;
  b.addEventListener('click', () => render(n));
  tabsEl.appendChild(b);
});

render(names[0]);
</script>
