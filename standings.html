<script>
/* Standings are generated by The Bot (model/standings.py) into bot/standings.json
   after every run, game nights included. Nothing here needs weekly editing.
   Badges show the national Elevation Index top 25. */
const tabsEl = document.getElementById('tabs');
const panelEl = document.getElementById('panel');
let DATA = {}, RANK = {};

try {
  const L = EI.history(CURRENT_WEEK).latest;
  L.forEach(t => { if (t.rank <= 25) RANK[t.name] = t.rank; });
} catch (e) { /* standings still work without badges */ }

function sortTeams(list) {
  const rec = r => r.split('-').map(Number);
  return list.slice().sort((a, b) => {
    const [cwa, cla] = rec(a.conf), [cwb, clb] = rec(b.conf);
    if (cwb !== cwa) return cwb - cwa;          // conference wins
    if (cla !== clb) return cla - clb;          // conference losses
    const [owa, ola] = rec(a.rec), [owb, olb] = rec(b.rec);
    if (owb !== owa) return owb - owa;          // overall wins
    if (ola !== olb) return ola - olb;          // overall losses
    const ra = RANK[a.name] || 999, rb = RANK[b.name] || 999;
    if (ra !== rb) return ra - rb;              // Elevation Index rank
    return a.team.localeCompare(b.team);
  });
}

function render(conf) {
  const rows = sortTeams(DATA[conf]).map(t => {
    const r = RANK[t.name];
    const badge = r ? '<span class="apr" title="Elevation Index national rank">' + r + '</span>' : '';
    return '<tr><td class="team">' + t.team + badge + '</td>' +
      '<td class="num">' + t.rec + '</td>' +
      '<td class="num">' + t.conf + '</td>' +
      '<td class="next">' + t.next + '</td></tr>';
  }).join('');

  panelEl.innerHTML =
    '<div class="table-scroll"><table class="standings">' +
    '<thead><tr><th scope="col">Team</th><th scope="col">Record</th>' +
    '<th scope="col">Conf.</th><th scope="col">Next game</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    '<p class="note" style="margin-top:.8rem;color:var(--muted);font-size:.85rem">Updates automatically after every game. Numbers next to a team are its national <a href="national-index.html">Elevation Index</a> rank (top 25).</p>';

  [...tabsEl.children].forEach(b =>
    b.setAttribute('aria-selected', b.textContent === conf ? 'true' : 'false'));
}

fetch('bot/standings.json?t=' + Date.now()).then(r => r.json()).then(d => {
  DATA = d.conferences;
  const w = d.week;
  document.getElementById('st-eyebrow').textContent = 'Updated through Week ' + w + ' | Week ' + (w + 1) + ' matchups';
  Object.keys(DATA).forEach(n => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.textContent = n;
    b.addEventListener('click', () => render(n));
    tabsEl.appendChild(b);
  });
  render(Object.keys(DATA)[0]);
}).catch(() => { panelEl.innerHTML = '<p>Standings are updating. Check back shortly.</p>'; });
</script>
